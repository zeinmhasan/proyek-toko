services:
  postgres:
    image: postgres:16-alpine
    container_name: tokoku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tokoku
      POSTGRES_PASSWORD: tokoku123
      POSTGRES_DB: tokoku_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokoku -d tokoku_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
